# SPDX-License-Identifier: GPL-3.0-or-later
# CI: generate the docs (fails on any broken internal link) and build the
# interactive site. This is the real health signal for the repo and does NOT
# depend on GitHub Pages — see pages.yml for deployment.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate Markdown (fails on broken links)
        run: python _meta/generate.py
      - name: Build the interactive site
        run: python _meta/build_site.py
