# SPDX-License-Identifier: GPL-3.0-or-later
# Build the docs, verify there are no broken internal links, and (on main) deploy
# the interactive site to GitHub Pages.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate Markdown (fails on broken links)
        run: python _meta/generate.py
      - name: Build the interactive site
        run: python _meta/build_site.py
      - name: Add .nojekyll (serve _-prefixed paths as-is)
        run: touch site/.nojekyll
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Publish the built site to GitHub Pages on pushes to main.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
